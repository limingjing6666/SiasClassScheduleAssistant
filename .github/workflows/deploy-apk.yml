name: Verify Release on Cloudflare

# 说明：
# 原 VPS 服务器已停用，应用更新元数据 (/app/update.json) 与 APK 流式下载
# 现已迁移至 Cloudflare Worker (sias-schedule-update) 直接托管于 limingjing.codes。
# 每次发布 GitHub Release 后，Worker 会在 5 分钟缓存周期内自动同步最新版本，
# 本工作流仅负责校验新版本 APK 资产及 Cloudflare 分发链路是否可用。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要校验的 Release tag（如 v1.0.22）'
        required: true
        type: string

jobs:
  verify:
    name: 校验 Cloudflare 更新分发链路
    runs-on: ubuntu-latest

    steps:
      - name: 确定 Release Tag 与 APK 资产名
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

          APK_NAME=$(gh release view "$TAG" --json assets -q '.assets[] | select(.name | endswith(".apk")) | .name' | head -n 1)
          if [ -z "$APK_NAME" ]; then
            echo "❌ Release ${TAG} 中未找到 .apk 资产"
            exit 1
          fi
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "✅ 检测到资产: ${APK_NAME}"

      - name: 校验 Cloudflare 分发端点
        run: |
          APK_NAME="${{ steps.meta.outputs.APK_NAME }}"
          ENCODED_APK=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))" "$APK_NAME")
          APK_URL="https://limingjing.codes/app/${ENCODED_APK}"
          UPDATE_URL="https://limingjing.codes/app/update.json"

          echo "🔎 检查更新元数据接口: ${UPDATE_URL}"
          curl -fsSL --retry 3 --retry-delay 5 "${UPDATE_URL}" | tee /tmp/update.json
          echo ""
          jq -e '.versionCode and .versionName and .url' /tmp/update.json >/dev/null

          echo "🔎 检查 APK 流式分发接口: ${APK_URL}"
          HTTP_CODE=$(curl -sSI --retry 3 --retry-delay 5 -o /tmp/apk_headers.txt -w '%{http_code}' "${APK_URL}")
          cat /tmp/apk_headers.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ APK 代理返回非 200 状态码: ${HTTP_CODE}"
            exit 1
          fi

          echo "✅ Cloudflare 分发校验通过（update.json 边缘缓存最长 5 分钟内自动刷新为 ${{ steps.meta.outputs.TAG }}）"
